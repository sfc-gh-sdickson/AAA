  <text x="190" y="382" text-anchor="middle" font-size="10" font-weight="bold" fill="#1B6B8E" font-family="Arial, sans-serif">Volume Forecasting</text>
  <text x="100" y="403" font-size="9" fill="#333" font-family="Arial, sans-serif">Algorithm: Gradient Boosting</text>
  <text x="100" y="418" font-size="9" fill="#333" font-family="Arial, sans-serif">Target: daily_request_count</text>
  <text x="100" y="433" font-size="9" fill="#333" font-family="Arial, sans-serif">Features: temporal + regional</text>
  <text x="100" y="448" font-size="9" fill="#333" font-family="Arial, sans-serif">Metric: RMSE, MAE</text>
  <text x="100" y="465" font-size="9" font-weight="bold" fill="#28A745" font-family="Arial, sans-serif">Task: TABULAR_REGRESSION</text>

  <rect x="330" y="365" width="220" height="110" rx="5" fill="white" stroke="#D63384" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="330" y="365" width="220" height="25" rx="5" fill="#FFF0F6"/>
  <text x="440" y="382" text-anchor="middle" font-size="10" font-weight="bold" fill="#8B1A5C" font-family="Arial, sans-serif">Churn Prediction</text>
  <text x="350" y="403" font-size="9" fill="#333" font-family="Arial, sans-serif">Algorithm: Random Forest</text>
  <text x="350" y="418" font-size="9" fill="#333" font-family="Arial, sans-serif">Target: will_churn (binary)</text>
  <text x="350" y="433" font-size="9" fill="#333" font-family="Arial, sans-serif">Features: engagement + tenure</text>
  <text x="350" y="448" font-size="9" fill="#333" font-family="Arial, sans-serif">Metric: AUC-ROC, Precision</text>
  <text x="350" y="465" font-size="9" font-weight="bold" fill="#28A745" font-family="Arial, sans-serif">Task: BINARY_CLASSIFICATION</text>

  <rect x="580" y="365" width="240" height="110" rx="5" fill="white" stroke="#28A745" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="580" y="365" width="240" height="25" rx="5" fill="#F0FFF4"/>
  <text x="700" y="382" text-anchor="middle" font-size="10" font-weight="bold" fill="#1B6B2E" font-family="Arial, sans-serif">Response Success</text>
  <text x="600" y="403" font-size="9" fill="#333" font-family="Arial, sans-serif">Algorithm: XGBoost Classifier</text>
  <text x="600" y="418" font-size="9" fill="#333" font-family="Arial, sans-serif">Target: successful_resolution</text>
  <text x="600" y="433" font-size="9" fill="#333" font-family="Arial, sans-serif">Features: request + weather + fleet</text>
  <text x="600" y="448" font-size="9" fill="#333" font-family="Arial, sans-serif">Metric: F1, Accuracy</text>
  <text x="600" y="465" font-size="9" font-weight="bold" fill="#28A745" font-family="Arial, sans-serif">Task: BINARY_CLASSIFICATION</text>

  <polygon points="445,492 455,492 450,510" fill="#7B61FF"/>

  <rect x="50" y="515" width="800" height="80" rx="6" fill="#FFFFF0" stroke="#E8830C" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="535" font-size="12" font-weight="bold" fill="#8B4E09" font-family="Arial, sans-serif">PHASE 4: Model Registry (Snowflake ML)</text>
  <text x="70" y="550" font-size="9" fill="#888" font-family="Arial, sans-serif">Registry.log_model() - Version Management - Metadata Storage</text>

  <rect x="80" y="560" width="200" height="25" rx="4" fill="white" stroke="#E8830C" stroke-width="1" filter="url(#shadow)"/>
  <text x="180" y="577" text-anchor="middle" font-size="9" fill="#333" font-family="Arial, sans-serif">log_model(model, metrics)</text>

  <rect x="300" y="560" width="200" height="25" rx="4" fill="white" stroke="#E8830C" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="577" text-anchor="middle" font-size="9" fill="#333" font-family="Arial, sans-serif">target: WAREHOUSE platform</text>

  <rect x="520" y="560" width="200" height="25" rx="4" fill="white" stroke="#E8830C" stroke-width="1" filter="url(#shadow)"/>
  <text x="620" y="577" text-anchor="middle" font-size="9" fill="#333" font-family="Arial, sans-serif">sample_input - schema inference</text>

  <polygon points="445,597 455,597 450,615" fill="#7B61FF"/>

  <rect x="50" y="620" width="800" height="80" rx="6" fill="#F0FFF4" stroke="#28A745" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="640" font-size="12" font-weight="bold" fill="#1B6B2E" font-family="Arial, sans-serif">PHASE 5: SQL Inference Functions - Agent Integration</text>
  <text x="70" y="655" font-size="9" fill="#888" font-family="Arial, sans-serif">UDF Wrappers - Intelligence Agent Tools</text>

