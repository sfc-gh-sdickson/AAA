  <text x="190" y="682" text-anchor="middle" font-size="9" fill="#333" font-family="Arial, sans-serif">PREDICT_SERVICE_VOLUME(params)</text>

  <rect x="320" y="665" width="220" height="25" rx="4" fill="white" stroke="#28A745" stroke-width="1" filter="url(#shadow)"/>
  <text x="430" y="682" text-anchor="middle" font-size="9" fill="#333" font-family="Arial, sans-serif">PREDICT_MEMBER_CHURN(params)</text>

  <rect x="560" y="665" width="220" height="25" rx="4" fill="white" stroke="#28A745" stroke-width="1" filter="url(#shadow)"/>
  <text x="670" y="682" text-anchor="middle" font-size="9" fill="#333" font-family="Arial, sans-serif">PREDICT_RESPONSE_SUCCESS(params)</text>

  <text x="450" y="718" text-anchor="middle" font-size="10" fill="#888" font-family="Arial, sans-serif">Snowpark ML Pipeline | Model Registry | SQL UDF Inference | Intelligence Agent Tools</text>
