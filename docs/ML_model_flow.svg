<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720">
  <rect width="900" height="720" fill="white"/>

  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="106%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="50" y="15" width="800" height="50" rx="8" fill="#7B61FF" filter="url(#shadow)"/>
  <text x="450" y="47" text-anchor="middle" fill="white" font-size="20" font-weight="bold" font-family="Arial, sans-serif">ACE Intelligence Agent - ML Model Pipeline</text>

  <rect x="50" y="80" width="800" height="100" rx="6" fill="#F8FAFE" stroke="#29B5E8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="100" font-size="12" font-weight="bold" fill="#1B6B8E" font-family="Arial, sans-serif">PHASE 1: Data Extraction &amp; Preparation</text>
  <text x="70" y="115" font-size="9" fill="#888" font-family="Arial, sans-serif">Snowpark Session - Query Source Tables</text>

  <rect x="80" y="125" width="200" height="40" rx="4" fill="white" stroke="#29B5E8" stroke-width="1" filter="url(#shadow)"/>
  <text x="180" y="143" text-anchor="middle" font-size="9" font-weight="bold" fill="#333" font-family="Arial, sans-serif">SERVICE_REQUESTS</text>
  <text x="180" y="157" text-anchor="middle" font-size="8" fill="#888" font-family="Arial, sans-serif">2M rows: timestamps, types, SLA</text>

  <rect x="300" y="125" width="200" height="40" rx="4" fill="white" stroke="#29B5E8" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="143" text-anchor="middle" font-size="9" font-weight="bold" fill="#333" font-family="Arial, sans-serif">MEMBERS + VEHICLES</text>
  <text x="400" y="157" text-anchor="middle" font-size="8" fill="#888" font-family="Arial, sans-serif">100K members, 150K vehicles</text>

  <rect x="520" y="125" width="200" height="40" rx="4" fill="white" stroke="#29B5E8" stroke-width="1" filter="url(#shadow)"/>
  <text x="620" y="143" text-anchor="middle" font-size="9" font-weight="bold" fill="#333" font-family="Arial, sans-serif">SERVICE_FULFILLMENT</text>
  <text x="620" y="157" text-anchor="middle" font-size="8" fill="#888" font-family="Arial, sans-serif">2M rows: outcomes, ratings</text>

  <rect x="740" y="125" width="80" height="40" rx="4" fill="white" stroke="#29B5E8" stroke-width="1" filter="url(#shadow)"/>
  <text x="780" y="148" text-anchor="middle" font-size="8" fill="#333" font-family="Arial, sans-serif">WEATHER</text>

  <polygon points="445,182 455,182 450,200" fill="#7B61FF"/>

  <rect x="50" y="205" width="800" height="90" rx="6" fill="#FFF8FC" stroke="#D63384" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="225" font-size="12" font-weight="bold" fill="#8B1A5C" font-family="Arial, sans-serif">PHASE 2: Feature Engineering</text>
  <text x="70" y="240" font-size="9" fill="#888" font-family="Arial, sans-serif">Snowpark DataFrames - Window Functions, Aggregations, Encoding</text>

